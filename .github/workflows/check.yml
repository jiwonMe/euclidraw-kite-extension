name: Check extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Without a Rust toolchain the build uses the committed src/generated/kite-solver-wasm.ts,
      # and fails if crate-kite-solver/ changed without regenerating it (source hash check).
      - run: git diff --exit-code -- dist/plugin.js alid.extension.json src/generated/kite-solver-wasm.ts
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --release
        working-directory: crate-kite-solver
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - run: node scripts/build-wasm.mjs --force
