[package]
name = "kite-solver"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kite Studio bytecode VM and XPBD manifold solver (Wasm SIMD)"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
